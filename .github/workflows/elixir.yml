name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BEAM_ELIXIR_VERSION: "1.20.5"
  BEAM_OTP_VERSION: "29.1.2"

jobs:
  unit_and_static:
    name: Unit, Lint, Dialyzer, and Coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.BEAM_ELIXIR_VERSION }}
          otp-version: ${{ env.BEAM_OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-

      - name: Cache Dialyzer PLT
        id: plt-cache
        uses: actions/cache@v5
        with:
          path: _build
          key: ${{ runner.os }}-dialyzer-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run Credo Linter
        run: mix credo

      - name: Run tests with coverage
        run: MIX_ENV=test mix coveralls.json

      - name: Upload coverage reports to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Unit Tests (Elixir 1.16 / OTP 26)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2.5.21"

      - name: Install test dependencies
        run: MIX_ENV=test mix deps.get

      - name: Run unit tests
        run: mix test

  integration:
    name: Integration Tests (RabbitMQ)
    runs-on: ubuntu-22.04

    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.BEAM_ELIXIR_VERSION }}
          otp-version: ${{ env.BEAM_OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "true"
          AMQP_TEST_HOST: "127.0.0.1"
          AMQP_TEST_PORT: "5672"
        run: MIX_ENV=test mix test --only integration
