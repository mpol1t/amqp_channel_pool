name: Publish Hex Package

on:
  push:
    tags:
      - 'v*.*.*'

env:
  BEAM_ELIXIR_VERSION: '1.20.5'
  BEAM_OTP_VERSION: '29.1.2'

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.BEAM_ELIXIR_VERSION }}
          otp-version: ${{ env.BEAM_OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.BEAM_ELIXIR_VERSION }}-${{ env.BEAM_OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Build package
        run: mix hex.build

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
